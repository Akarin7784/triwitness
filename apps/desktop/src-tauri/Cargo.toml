[package]
name = "triwitness-desktop"
version = "0.5.0-preview"
description = "TriWitness / 三证 desktop shell"
authors = ["Eva Murphy"]
edition = "2021"

[lib]
name = "triwitness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "6"
# API 密钥存系统凭据库（Windows 凭据管理器 / macOS 钥匙串 / Linux 内核密钥环）
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

# Windows：直接改 WebView2 设置（Tauri v2 配置未暴露这些开关）
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

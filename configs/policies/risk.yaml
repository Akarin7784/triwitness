# 风险分级（04 §4.6，spec 009）：每个 PR 计算 0–100 分 → L0–L3；每个加分项都写进证据包。
# 权重先用设计文档默认值，W3-14 / W5 用“风险等级 vs 隐藏测试结果”的数据校准。
version: 1
levels:            # 下限（含）：L0 = 0–14、L1 = 15–39、L2 = 40–69、L3 = ≥70
  L1: 15
  L2: 40
  L3: 70
factors:
  lines_over_200: 10          # 改动行数 > 200
  lines_over_500: 20          # 改动行数 > 500（与上一条取其一）
  sensitive_path: 25          # auth / crypto / security / 权限 / 支付 / migrations
  ci_build_deps: 20           # CI / 构建 / 依赖文件
  existing_test_modified: 20  # 删改已有测试
  low_coverage: 15            # 改动行覆盖率 < 50%（没有覆盖率数据时不计）
  repro_not_reproduced: 15    # 复现状态 not_applicable / inconclusive / failed
  verifier_uncertain: 20      # Verifier inconclusive 或置信度 < 0.6
  review_major_open: 25       # Reviewer 有未解决的 major / blocker
  public_api_changed: 10      # 公共 API 签名变化
  security_scan: 20           # bandit 中高告警
  claim_audit: 15             # 声明审计发现问题（复现与 Issue 不对应、声明与自述风险矛盾…）
coverage_threshold: 0.5
verifier_confidence_threshold: 0.6
sensitive_paths: ["auth", "crypto", "security", "permission", "secret", "payment", "billing", "migrations/"]
build_files: ["pyproject.toml", "setup.py", "setup.cfg", "requirements*.txt", "Pipfile*", "poetry.lock", "uv.lock",
              "Dockerfile", "Makefile", ".github/workflows/*", ".gitlab-ci.yml", "tox.ini", "noxfile.py"]
floors:            # 硬下限（不看分数）
  anticheat_block: L3        # 新增 skip / xfail、针对测试特判 → 不开 PR，NEEDS_HUMAN
  anticheat_review: L2       # 删改已有测试、削弱断言、改测试基础设施
  clean_env_unverified: L2   # 无沙箱：没在干净环境复跑（spec 002 §8 / ADR-0005 §3.3），禁止自动合并
  repro_not_reproduced: L1

# 中国法定节假日放假日（含调休放假）与调休上班日
# 来源：国务院办公厅关于2026年部分节假日安排的通知（国办发明电〔2025〕7号）
#   https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm （2026-10-10 核对）
# DeepSeek 高峰定义：“北京时间周一至周五（不含中国法定节假日）9:00-12:00、14:00-18:00；其余时段，包括周末及法定节假日全天均为空闲”。
# 按字面理解：调休上班的周六/周日仍是“周末”→ 空闲；放假期间的周一至周五 → 空闲。
# 若日后账单显示调休上班日按高峰计费，把 pricing.yaml 的 adjusted_workdays_are_peak 改为 true。
source: https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm
verified_at: "2026-10-10"
holidays:
  - ["2026-01-01", "2026-01-03"]   # 元旦
  - ["2026-02-15", "2026-02-23"]   # 春节
  - ["2026-04-04", "2026-04-06"]   # 清明
  - ["2026-05-01", "2026-05-05"]   # 劳动节
  - ["2026-06-19", "2026-06-21"]   # 端午
  - ["2026-09-25", "2026-09-27"]   # 中秋
  - ["2026-10-01", "2026-10-07"]   # 国庆
adjusted_workdays:                  # 调休上班日（周末）
  - "2026-01-04"
  - "2026-02-14"
  - "2026-02-28"
  - "2026-05-09"
  - "2026-09-20"
  - "2026-10-10"
covered_years: [2026]               # 超出范围的年份只按周一至周五判断，并打 WARNING

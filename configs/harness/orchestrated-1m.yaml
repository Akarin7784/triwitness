# W4 多角色编排（spec 010）：long-context-1m + Planner + Reviewer。全部 deepseek-flash（永不 v4-pro），同厂商异构评审。
# 默认 harness 仍是 long-context-1m（角色关闭）；桌面端是否默认切到本配置待 Eva 定（spec 010 §11 Q4）。
extends: long-context-1m.yaml
orchestration:
  planner: {enabled: true, max_turns: 30}
  reviewer: {enabled: true, max_rounds: 2, max_turns: 20, consensus: false}
  plan_approval:
    min_risk: L2              # §11 Q1：待 Eva 拍板（更保守可改 L1）
    on_open_questions: true
    on_sensitive_files: true
    unattended: needs_human   # 终端 tw run 无审批通道 → NEEDS_HUMAN
    eval_reject_from: never   # §11 Q2（Eva 21:36）：评测里计划全部自动批准，含 L3
  hitl: {dependency_changes: true, ci_changes: true}   # §11 Q7：改依赖声明 / CI 配置必须人确认（默认，待 Eva 审）
# ask_human（W4-10）：Executor 可以向人提问（阻塞 / 不阻塞）；评测里不问人，直接按最佳判断继续
# 用户对 ask_human 的回答是用户指示，不包成不可信数据
context: {trusted_tools: [ask_human, edit_file, finish, write_file]}
tools: [ask_human, bash, edit_file, finish, git, grep, list_files, notes, read_file, run_tests, submit_repro, write_file]
prompts: {executor: executor-repro-first, summarizer: summarizer, planner: planner, reviewer: reviewer,
          reviewer_checklist: reviewer-checklist}

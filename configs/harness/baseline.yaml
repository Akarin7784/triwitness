# Harness 基线参数（spec 003 §5、§8；spec 007）。全部是消融变量；其他配置用 extends 只写差异（W2-15）。
prompts: {executor: executor, summarizer: summarizer}   # src/triwitness/prompts/<name>.md，版本号写进轨迹
tools: [bash, edit_file, finish, git, grep, list_files, notes, read_file, run_tests, write_file]
loop:
  stuck_after_no_tool: 3          # 连续 N 次没有工具调用 → stuck
  head_ratio: 0.6                 # 工具结果超长：头 60% 尾 40%，全文写 .tw/outputs/
  head_ratio_by_tool: {bash: 0.3, powershell: 0.3, run_tests: 0.25}   # 命令 / 测试的错误多在末尾
loop_detection:
  window: 8
  repeat_threshold: 3             # 窗口内相同工具 + 相同参数 ≥ N 次
  failure_threshold: 5            # 连续失败 N 次
  no_progress_threshold: 6        # 连续 N 次工具调用没有修改文件、也没有新的读取目标
  max_warnings: 3                 # 第 3 次 → stuck
context:
  working_budget_tokens: 128000   # 工作上限，不按 1M 用满
  clear: true
  compact: true
  clear_at: 0.6                   # > 60% → 批量把较早的可重取结果换成占位符（攒着一次清，少破坏缓存前缀）
  clear_to: 0.35                  # 一旦清理就清到 35% 以下（滞回）；保证两次清理之间有足够长的只追加区间
  compact_at: 0.8                 # 清理后仍 > 80% → 先写 NOTES.md，再用 summarizer 压缩
  keep_recent: 8                  # 清理时保留最近 8 条工具结果
  keep_recent_turns: 4            # 压缩时原样保留最近 4 轮
  clearable_tools: [git, grep, list_files, notes, read_file, repo_map, run_tests]
  untrusted_wrap: true            # Issue / 工具输出包 <untrusted source=...>
  trusted_tools: [edit_file, finish, write_file]
  chars_per_token: 3.0
  min_steps_between_compactions: 3
  allocation:                     # token；固定部分之和 ≤ clear_at × 工作预算
    prefix: 12000
    task: 8000
    notes: 2000
    summary: 4000
    tool_result: 8000
    repo_map: 2000
reminders:
  no_tool: "请调用工具继续，或调用 finish 结束。"
  wrap_up: "预算已用到警戒线，请尽快收尾：运行测试并调用 finish。"
  repeat: "你在重复同样的动作（{detail}）。换个思路：先读相关代码或运行测试定位问题。"
  failures: "连续多次工具调用失败（{detail}）。停下来检查错误信息，换一种做法。"
  no_progress: "已经 {detail}。请动手修改代码、运行测试，或调用 finish 说明卡在哪里。"

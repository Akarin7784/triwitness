schema_version = "1.3"

[task]
name = "triwitness/duration-minutes"
description = "parse_duration treats minutes as seconds"
keywords = ["python", "bugfix", "synthetic"]

[metadata]
source = "synthetic"
difficulty = "easy"
tags = ["python", "parsing"]
created_at = "2026-10-10"
license = "Apache-2.0"

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[environment]
network_mode = "no-network"
cpus = 1
memory_mb = 1024
workdir = "/workspace/repo"

[tw]
test_cmd = "python -m pytest -q"
fail_to_pass = ["tests/test_duration_hidden.py::test_minutes", "tests/test_duration_hidden.py::test_combined"]
pass_to_pass = ["tests/test_duration_hidden.py::test_seconds", "tests/test_duration_hidden.py::test_hours", "tests/test_duration_hidden.py::test_invalid"]
max_cost_cny = 0.3

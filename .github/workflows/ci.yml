name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff / pyright / pytest)
    runs-on: ubuntu-24.04
    env:
      TW_LLM_MODE: replay   # 单测与 CI 永不真调模型（ADR-0002）
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest (no integration / live)
        run: uv run pytest
      - name: Sandbox integration (docker backend; skips if docker unavailable)
        run: |
          docker pull -q python:3.12-slim
          uv run pytest -m integration tests/integration/sandbox

  windows:
    name: windows (pytest; real Job Object / Git Bash / paths)
    runs-on: windows-latest
    env:
      TW_LLM_MODE: replay
      PYTHONUTF8: "1"       # 测试代码里有中文 write_text；src 自身全部显式 utf-8
    defaults:
      run:
        shell: bash          # Git Bash；pipefail 默认开启
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Pytest (full unit suite)
        run: uv run pytest -rs
      - name: Windows-specific tests ran for real (none skipped)
        run: |
          uv run pytest -v -rs tests/unit/windows tests/unit/sandbox/test_local_backend.py tests/unit/harness/test_loop_local.py | tee win.txt
          ! grep -E "SKIPPED|skipped" win.txt

  desktop:
    name: desktop (oxlint / vitest / tsc / vite build, no installer)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Event types in sync with schema
        run: npm run check:events
      - name: Unit tests (vitest)
        run: npm test
      - name: Build web assets (tsc -b && vite build)
        run: npm run build

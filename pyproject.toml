[project]
name = "triwitness"
version = "0.3.1a1"
description = "TriWitness（三证）：验证优先的后台 Coding Agent（v0.1 只用 DeepSeek Flash）"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.3",
    "typer>=0.12",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.scripts]
tw = "triwitness.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-pyyaml>=6.0.12.20260906",
    "types-docker>=7.2.0.20261006",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20261006",
]
# 桌面安装包内置核心（packaging/core/build_core.py；CI 在 windows-latest 上构建 tw.exe）
package = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triwitness"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps", "evals/tasks", "evals/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 允许中文全角标点

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration and not live'"
asyncio_mode = "auto"
markers = [
    "integration: 需要 Docker",
    "live: 真实调用模型 API（花钱；只在空闲价时段手动运行）",
]
